[package]
name = "anlg-audio-actual"
version = "0.1.0"
edition = "2024"

[dependencies]
anlg-audio = { path = "../anlg-audio" }
anlg-audio-interface = { path = "../anlg-audio-interface" }
anlg-audio-utils = { path = "../anlg-audio-utils" }
anlg-resampler = { path = "../anlg-resampler" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"

bytes = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

futures-channel = "0.3.31"
futures-util = "0.3.31"
pin-project = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.15"

cpal = "0.17"
dasp = { version = "0.11.0", features = ["interpolate", "interpolate-linear"] }
rodio = { version = "0.22", features = ["tracing"] }

ebur128 = "0.1.10"
ringbuf = "0.4.8"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", default-features = false, features = ["app", "async", "av", "ax", "blocks", "cm", "core_audio", "dispatch", "io_kit", "io_pm", "macos_15_0"] }
